<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EmoID{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3498db',
                        dark: '#2c3e50',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="bg-dark text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">🎭 EmoID</h1>
            <nav class="flex gap-2">
                <a href="/" class="px-4 py-2 rounded-lg transition {% if pagina == 'dashboard' %}bg-white/20 text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
                    📊 Dashboard
                </a>
                <a href="/gravar" class="px-4 py-2 rounded-lg transition {% if pagina == 'gravar' %}bg-white/20 text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
                    🎥 Gravar
                </a>
                <a href="/videos" class="px-4 py-2 rounded-lg transition {% if pagina == 'videos' %}bg-white/20 text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
                    📹 Vídeos
                </a>
                <a href="/alunos" class="px-4 py-2 rounded-lg transition {% if pagina == 'alunos' %}bg-white/20 text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
                    👤 Alunos
                </a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto px-6 py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-6 text-gray-500 text-sm">
        EmoID - Sistema de Reconhecimento Facial de Emoções
    </footer>
</body>
</html>
