{% extends "base.html" %}

{% block title %}Gravar - EmoID{% endblock %}

{% block content %}
<h2 class="text-3xl font-bold text-gray-800 mb-6">🎥 Gravar Vídeo</h2>

<div class="bg-white rounded-xl shadow-md p-6 max-w-3xl mx-auto">
    <div id="video-container" class="relative isolate mb-6 w-full overflow-hidden rounded-lg bg-black" style="aspect-ratio: 4 / 3;">
        <video id="video" autoplay playsinline class="absolute inset-0 z-0 block h-full w-full object-fill" style="transform: scaleX(-1);"></video>
        <canvas id="canvas-overlay" width="640" height="480" aria-hidden="true" class="absolute inset-0 z-10 block h-full w-full pointer-events-none"></canvas>
    </div>

    <div class="flex gap-4 justify-center mb-6">
        <button id="btn-iniciar" class="px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg transition shadow-md">
            ▶️ Iniciar Captura
        </button>
        <button id="btn-parar" disabled class="px-6 py-3 bg-red-500 hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold rounded-lg transition shadow-md">
            ⏹️ Parar e Salvar
        </button>
    </div>

    <div class="text-center text-gray-600 space-y-1">
        <p>Status: <span id="status" class="font-semibold">Aguardando...</span></p>
        <p>Frames processados: <span id="frames" class="font-semibold">0</span></p>
    </div>
</div>

<script src="/static/gravar.js"></script>
{% endblock %}
